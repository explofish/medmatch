name: Deploy to GitHub Pages Staging

on:
  push:
    branches: [master, staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-landing-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json
      
      - name: Install dependencies
        run: cd landing-page && npm ci
      
      - name: Build landing page
        run: cd landing-page && npm run build
        env:
          NEXT_PUBLIC_API_URL: https://medmatch-api-demo.onrender.com
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: medmatch-demo.vercel.app
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing-page/dist
      
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
