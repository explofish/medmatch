name: Deploy MedMatch API

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'deploy/api/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd deploy/api
          npm ci || npm install
      
      - name: Verify API starts
        run: |
          cd deploy/api
          timeout 5s node server-memory.js &
          sleep 2
          curl -s http://localhost:3000/api/health || echo "Health check failed"
