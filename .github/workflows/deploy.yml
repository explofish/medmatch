name: Deploy MedMatch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build landing page
        run: npm run build
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ secrets.PLAUSIBLE_DOMAIN }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: landing-page-dist
          path: landing-page/dist/

  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medmatch
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: medmatch/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma client
        run: npx prisma generate
      
      - name: Build backend
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medmatch-dist
          path: medmatch/.next/

  deploy-production:
    needs: [build-landing, build-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Download landing page build
        uses: actions/download-artifact@v4
        with:
          name: landing-page-dist
          path: landing-page/dist/
      
      - name: Deploy to Vercel (Landing Page)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--prod'
          working-directory: landing-page
      
      - name: Deploy to Railway (Backend)
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: medmatch-api
