<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedMatch - Job Search Example</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f5f7fa;
      color: #333;
      line-height: 1.6;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px 20px;
      text-align: center;
      margin-bottom: 30px;
      border-radius: 12px;
    }
    
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    
    .subtitle {
      opacity: 0.9;
      font-size: 1.1rem;
    }
    
    .search-section {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    
    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .filter-group {
      display: flex;
      flex-direction: column;
    }
    
    label {
      font-weight: 600;
      margin-bottom: 8px;
      color: #555;
      font-size: 0.9rem;
    }
    
    input, select {
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .salary-range {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    
    .salary-range input {
      flex: 1;
    }
    
    .salary-range span {
      color: #999;
    }
    
    .button-group {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    button {
      padding: 14px 32px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: #f0f0f0;
      color: #555;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    .stats-bar {
      background: #f8f9fa;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    
    .stats {
      color: #666;
      font-size: 0.95rem;
    }
    
    .stats strong {
      color: #667eea;
    }
    
    .loading {
      text-align: center;
      padding: 60px;
      color: #999;
    }
    
    .loading::after {
      content: '';
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #667eea;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .error-message {
      background: #fff5f5;
      color: #c53030;
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid #c53030;
      margin-bottom: 20px;
    }
    
    .jobs-grid {
      display: grid;
      gap: 20px;
    }
    
    .job-card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    
    .job-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      border-color: #667eea;
    }
    
    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .job-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 5px;
    }
    
    .employer-name {
      color: #667eea;
      font-weight: 600;
      font-size: 1rem;
    }
    
    .salary-badge {
      background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    
    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 15px;
    }
    
    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #666;
      font-size: 0.95rem;
    }
    
    .meta-icon {
      width: 18px;
      height: 18px;
      opacity: 0.6;
    }
    
    .job-description {
      color: #555;
      margin-bottom: 20px;
      line-height: 1.7;
    }
    
    .job-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    
    .job-type {
      background: #edf2f7;
      color: #4a5568;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
    }
    
    .apply-btn {
      background: #667eea;
      color: white;
      padding: 10px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    
    .apply-btn:hover {
      background: #5a67d8;
    }
    
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 30px;
      padding: 20px;
    }
    
    .pagination button {
      padding: 12px 24px;
    }
    
    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .page-info {
      color: #666;
      font-weight: 500;
    }
    
    .no-results {
      text-align: center;
      padding: 60px;
      color: #666;
    }
    
    .no-results h3 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: #2d3748;
    }
    
    .specialty-tag {
      background: #e6fffa;
      color: #234e52;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏥 MedMatch Job Search</h1>
      <p class="subtitle">Find your perfect medical position in Germany</p>
    </header>
    
    <div class="search-section">
      <div class="filters">
        <div class="filter-group">
          <label for="specialty">Specialty</label>
          <select id="specialty">
            <option value="">All Specialties</option>
            <option value="Innere Medizin">Innere Medizin</option>
            <option value="Kardiologie">Kardiologie</option>
            <option value="Chirurgie">Chirurgie</option>
            <option value="Orthopädie">Orthopädie</option>
            <option value="Pädiatrie">Pädiatrie</option>
            <option value="Neurologie">Neurologie</option>
            <option value="Anästhesiologie">Anästhesiologie</option>
            <option value="Dermatologie">Dermatologie</option>
            <option value="Gynäkologie">Gynäkologie</option>
            <option value="Radiologie">Radiologie</option>
            <option value="Psychiatrie">Psychiatrie</option>
            <option value="Urologie">Urologie</option>
            <option value="HNO">HNO</option>
            <option value="Augenheilkunde">Augenheilkunde</option>
            <option value="Unfallchirurgie">Unfallchirurgie</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label for="location">Location</label>
          <select id="location">
            <option value="">All Locations</option>
            <option value="Berlin">Berlin</option>
            <option value="München">München</option>
            <option value="Hamburg">Hamburg</option>
            <option value="Köln">Köln</option>
            <option value="Frankfurt">Frankfurt</option>
            <option value="Stuttgart">Stuttgart</option>
            <option value="Düsseldorf">Düsseldorf</option>
            <option value="Leipzig">Leipzig</option>
            <option value="Heidelberg">Heidelberg</option>
            <option value="Freiburg">Freiburg</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label for="jobType">Job Type</label>
          <select id="jobType">
            <option value="">All Types</option>
            <option value="full-time">Full-time</option>
            <option value="part-time">Part-time</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label>Salary Range (€)</label>
          <div class="salary-range">
            <input type="number" id="minSalary" placeholder="Min" min="0" step="1000">
            <span>-</span>
            <input type="number" id="maxSalary" placeholder="Max" min="0" step="1000">
          </div>
        </div>
      </div>
      
      <div class="button-group">
        <button class="btn-primary" onclick="searchJobs()">
          🔍 Search Jobs
        </button>
        <button class="btn-secondary" onclick="clearFilters()">
          Clear Filters
        </button>
        <button class="btn-secondary" onclick="seedData()">
          🌱 Seed Sample Data
        </button>
      </div>
    </div>
    
    <div id="results-container">
      <div class="stats-bar" style="display: none;">
        <span class="stats">Showing <strong id="showing-count">0</strong> of <strong id="total-count">0</strong> jobs</span>
        <span class="stats">Page <strong id="current-page">1</strong> of <strong id="total-pages">1</strong></span>
      </div>
      
      <div id="jobs-container" class="jobs-grid">
        <div class="no-results">
          <h3>Ready to find your dream job?</h3>
          <p>Use the filters above and click "Search Jobs" to get started.</p>
        </div>
      </div>
      
      <div class="pagination" style="display: none;">
        <button id="prev-btn" class="btn-secondary" onclick="changePage(-1)">← Previous</button>
        <span class="page-info">Page <span id="page-num">1</span></span>
        <button id="next-btn" class="btn-secondary" onclick="changePage(1)">Next →</button>
      </div>
    </div>
  </div>

  <!-- Import the MedMatch Client -->
  <script type="module">
    import { MedMatchClient } from '../medmatch-client.js';
    
    // Initialize the API client
    const client = new MedMatchClient({
      baseUrl: 'http://localhost:3000',
      timeout: 15000,
      retries: 3
    });
    
    // State
    let currentPage = 1;
    let totalPages = 1;
    let currentFilters = {};
    
    // Make functions available globally
    window.searchJobs = async () => {
      currentPage = 1;
      currentFilters = {
        specialty: document.getElementById('specialty').value,
        location: document.getElementById('location').value,
        jobType: document.getElementById('jobType').value,
        minSalary: document.getElementById('minSalary').value,
        maxSalary: document.getElementById('maxSalary').value,
        page: 1,
        limit: 10
      };
      
      await loadJobs();
    };
    
    window.clearFilters = () => {
      document.getElementById('specialty').value = '';
      document.getElementById('location').value = '';
      document.getElementById('jobType').value = '';
      document.getElementById('minSalary').value = '';
      document.getElementById('maxSalary').value = '';
      currentPage = 1;
      currentFilters = {};
      document.getElementById('jobs-container').innerHTML = `
        <div class="no-results">
          <h3>Ready to find your dream job?</h3>
          <p>Use the filters above and click "Search Jobs" to get started.</p>
        </div>
      `;
      document.querySelector('.stats-bar').style.display = 'none';
      document.querySelector('.pagination').style.display = 'none';
    };
    
    window.changePage = (delta) => {
      const newPage = currentPage + delta;
      if (newPage >= 1 && newPage <= totalPages) {
        currentPage = newPage;
        currentFilters.page = currentPage;
        loadJobs();
      }
    };
    
    window.seedData = async () => {
      const container = document.getElementById('jobs-container');
      container.innerHTML = '<div class="loading">Seeding sample data</div>';
      
      try {
        await client.seedData();
        container.innerHTML = `
          <div class="no-results">
            <h3>✅ Sample data created!</h3>
            <p>Click "Search Jobs" to see the sample positions.</p>
          </div>
        `;
      } catch (error) {
        container.innerHTML = `
          <div class="error-message">
            <strong>Error seeding data:</strong> ${error.message}
          </div>
        `;
      }
    };
    
    async function loadJobs() {
      const container = document.getElementById('jobs-container');
      const statsBar = document.querySelector('.stats-bar');
      const pagination = document.querySelector('.pagination');
      
      container.innerHTML = '<div class="loading">Searching for jobs</div>';
      statsBar.style.display = 'none';
      pagination.style.display = 'none';
      
      try {
        const response = await client.listJobs(currentFilters);
        const { data, pagination: pageInfo } = response.data;
        
        totalPages = pageInfo.totalPages;
        
        // Update stats
        document.getElementById('showing-count').textContent = data.length;
        document.getElementById('total-count').textContent = pageInfo.total;
        document.getElementById('current-page').textContent = pageInfo.page;
        document.getElementById('total-pages').textContent = pageInfo.totalPages;
        document.getElementById('page-num').textContent = pageInfo.page;
        
        statsBar.style.display = 'flex';
        
        if (data.length === 0) {
          container.innerHTML = `
            <div class="no-results">
              <h3>No jobs found</h3>
              <p>Try adjusting your filters or click "Seed Sample Data" to add sample jobs.</p>
            </div>
          `;
        } else {
          container.innerHTML = data.map(job => renderJobCard(job)).join('');
        }
        
        // Update pagination
        document.getElementById('prev-btn').disabled = !pageInfo.hasPrevPage;
        document.getElementById('next-btn').disabled = !pageInfo.hasNextPage;
        pagination.style.display = 'flex';
        
      } catch (error) {
        container.innerHTML = `
          <div class="error-message">
            <strong>Error loading jobs:</strong> ${error.message}
            <br><br>
            <small>Make sure the API server is running on http://localhost:3000</small>
          </div>
        `;
      }
    }
    
    function renderJobCard(job) {
      const formatSalary = (min, max) => {
        if (min && max) return `€${(min/1000).toFixed(0)}k - €${(max/1000).toFixed(0)}k`;
        if (min) return `From €${(min/1000).toFixed(0)}k`;
        if (max) return `Up to €${(max/1000).toFixed(0)}k`;
        return 'Salary negotiable';
      };
      
      const formatDate = (date) => {
        return new Date(date).toLocaleDateString('de-DE', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
      };
      
      return `
        <div class="job-card">
          <div class="job-header">
            <div>
              <h3 class="job-title">${job.title}</h3>
              <div class="employer-name">${job.employerName || 'Unknown Employer'}</div>
            </div>
            <div class="salary-badge">${formatSalary(job.salaryMin, job.salaryMax)}</div>
          </div>
          
          <div class="job-meta">
            ${job.specialty ? `
              <div class="meta-item">
                <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M12 6v6l4 2"/>
                </svg>
                <span class="specialty-tag">${job.specialty}</span>
              </div>
            ` : ''}
            ${job.location ? `
              <div class="meta-item">
                <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                  <circle cx="12" cy="10" r="3"/>
                </svg>
                <span>${job.location}</span>
              </div>
            ` : ''}
            ${job.experienceRequired !== null ? `
              <div class="meta-item">
                <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                  <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                <span>${job.experienceRequired}+ years exp.</span>
              </div>
            ` : ''}
            <div class="meta-item">
              <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
              <span>Posted ${formatDate(job.postedAt)}</span>
            </div>
          </div>
          
          ${job.description ? `<p class="job-description">${job.description}</p>` : ''}
          ${job.requirements ? `<p class="job-description"><strong>Requirements:</strong> ${job.requirements}</p>` : ''}
          
          <div class="job-footer">
            <span class="job-type">${job.jobType || 'Full-time'}</span>
            <a href="#" class="apply-btn" onclick="alert('Apply for: ${job.title}')">Apply Now</a>
          </div>
        </div>
      `;
    }
    
    // Health check on load
    client.health().then(() => {
      console.log('✅ Connected to MedMatch API');
    }).catch(() => {
      console.warn('⚠️ API server not available. Run: cd mock-api && npm start');
    });
  </script>
</body>
</html>
