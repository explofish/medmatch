services:
  - type: web
    name: medmatch-api
    runtime: node
    plan: free
    rootDir: mock-api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: info
      - key: LOG_REQUESTS
        value: true
      - key: ENABLE_SEED_ENDPOINT
        value: false
      - key: ENABLE_HEALTH_ENDPOINT
        value: true
      - key: AUTH_API_KEY
        generateValue: true
        # Admin API key - retrieve from Render dashboard after deploy
        # Used to protect sensitive endpoints like /api/signups
