services:
  - type: web
    name: medmatch-api
    runtime: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medmatch-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://api.medmatch.de

  - type: web
    name: medmatch-static
    runtime: static
    buildCommand: cd ../landing-page && npm install && npm run build
    staticPublishPath: ../landing-page/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://medmatch-api.onrender.com/api/$1

databases:
  - name: medmatch-db
    databaseName: medmatch
    user: medmatch
