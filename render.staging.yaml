services:
  - type: web
    name: medmatch-api-staging
    runtime: node
    rootDir: mock-api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: "*"
    plan: free
