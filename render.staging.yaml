services:
  - type: web
    name: medmatch-api-demo
    runtime: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: staging
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://medmatch-api-demo.onrender.com
      - key: CORS_ORIGINS
        value: https://medmatch-demo.vercel.app,https://www.medmatch-demo.vercel.app,http://localhost:3000,http://localhost:3001
      - key: DATABASE_URL
        fromDatabase:
          name: medmatch-demo-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false # Set manually in Render dashboard

databases:
  - name: medmatch-demo-db
    databaseName: medmatch_demo
    user: medmatch_demo
